<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Registration Form</title>
<style>
 

  .registration-container {
    width: 600px;
    height:500px;
    margin: 30px auto;
    padding: 30px;
    border: 2px solid #ccc;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #333;
  }

  label {
    display: block;
    margin-top: 6px;
    font-size: 18px;
    font-weight: 600;
    color: #444;
  }

  input[type="text"] {
    width: 100%;
    padding: 8px;
    margin-top: 2px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
  }
  #studentfees{
  	width: 100%;
    padding: 8px;
    margin-top: 2px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
  }

  .submit {
    
    width: 40%;
    margin-top: 6%;
    margin-left: 6%;
    padding: 10px;
    font-size: 18px;
    font-weight: 600;
    background-color:#009fa2;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    
  }

  #submit1:hover {
    background-color: #00ffbf;
  }
  
  #retrieve:hover {
    background-color: #0f0f00;
  }
 
  form {
    display:inline;
    margin-bottom: 10px;
  }
</style>
</head>
<body>
  <div class="registration-container">
    <h2>Student Registration Form</h2>

    <form action="collectFormData.jsp" method="post">
      <label for="studentid">Student Id</label>
      <input type="text" id="studentid" name="studentid" required>

      <label for="studentname">Student Name</label>
      <input type="text" id="studentname" name="studentname" required>

      <label for="studentbranch">Student Branch</label>
      <input type="text" id="studentbranch" name="studentbranch" required>

      <label for="studentfees">Student Fees</label>
      <input type="number" id="studentfees" name="studentfees" required>

      <label for="studentaddress">Student Address</label>
      <input type="text" id="studentaddress" name="studentaddress" required>

    
      <input type="submit" value="Save Record" class="submit" id="submit1" name="submit">
      
    </form>
    
      <form action="RetrieveData.jsp">
      <input type="submit" value="View Records" class="submit" id="retrieve">
    </form>
  </div>
</body>
</html>
